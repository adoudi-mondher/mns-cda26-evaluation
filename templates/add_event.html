{% extends "base.html" %}

{% block content %}

    <h1 class="text-3xl font-bold mb-6">Ajouter un Évènement</h1>

    <form method="POST" class="bg-white p-6 rounded shadow max-w-2xl">
        
        <div class="mb-4">
            <label class="block font-semibold mb-2">Titre</label>
            <input type="text" 
                   name="title" 
                   required 
                   class="w-full border p-2 rounded">
        </div>

        <div class="mb-4">
            <label class="block font-semibold mb-2">Type d'évènement</label>
            <select name="type_event" 
                    required 
                    class="w-full border p-2 rounded">
                {% for type in types %}
                    <option value="{{ type.name }}">{{ type.value }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-4">
            <label class="block font-semibold mb-2">Date proposée</label>
            <input type="date" 
                   name="date_event" 
                   required 
                   class="w-full border p-2 rounded">
        </div>

        <div class="mb-4">
            <label class="block font-semibold mb-2">Lieu</label>
            <input type="text" 
                   name="locality" 
                   required 
                   class="w-full border p-2 rounded">
        </div>

        <div class="mb-4">
            <label class="block font-semibold mb-2">Description</label>
            <textarea name="description" 
                      rows="4" 
                      required 
                      class="w-full border p-2 rounded"></textarea>
        </div>

        <div class="flex gap-4">
            <button type="submit" 
                    class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
                Créer l'évènement
            </button>
            <a href="/" 
               class="bg-gray-300 text-gray-700 px-6 py-2 rounded hover:bg-gray-400">
                Annuler
            </a>
        </div>

    </form>

{% endblock %}
